name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key

      - name: Add EC2 to Known Hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/github_actions_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            cd ~/IntelliGroud-

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "Waiting for backend..."

            for i in {1..30}; do
              if curl --fail --silent --show-error \
                  http://localhost:8000/health > /dev/null; then
                echo "Backend is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend failed to become healthy."
                docker compose logs --tail=100 backend
                exit 1
              fi

              echo "Backend not ready yet. Attempt $i/30..."
              sleep 2
            done

            echo "Checking frontend..."

            for i in {1..30}; do
              if curl --fail --silent --show-error \
                  http://localhost:8501/ > /dev/null; then
                echo "Frontend is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Frontend failed to become healthy."
                docker compose logs --tail=100 frontend
                exit 1
              fi

              echo "Frontend not ready yet. Attempt $i/30..."
              sleep 2
            done

            echo "Checking container status..."
            docker compose ps

            echo "Deployment successful."

          EOF
