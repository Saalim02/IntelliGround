services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag_backend

    user: "1001:1001"

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8501}
      LOCAL_DEV_AUTH_BYPASS: ${LOCAL_DEV_AUTH_BYPASS:-true}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-openai}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EVON_MODEL: ${EVON_MODEL:-gnani-evon-v3.3}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}

    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

    restart: unless-stopped
