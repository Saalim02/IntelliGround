services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag_backend

    user: "1001:1001"

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8501}
      LOCAL_DEV_AUTH_BYPASS: ${LOCAL_DEV_AUTH_BYPASS:-true}

    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

    restart: unless-stopped
